[project]
name = "synthetic-data-pipeline"
version = "0.1.0"
description = "CAD (STEP) to instance-segmentation training data via Isaac Sim/Replicator, plus YOLO26-seg training."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python",
    "ultralytics",
    "torch",
    "torchvision",
]

# This repo is a set of top-level scripts + a utils/ package imported via
# cwd, not a library meant to be built/distributed - tell uv not to treat it
# as an installable package (skips needing a [build-system] / src layout).
[tool.uv]
package = false

# torch/torchvision default to CPU-only wheels on PyPI, which silently
# trains on CPU instead of the GPU. Route just those two packages to the
# CUDA build instead - `explicit = true` means this index is ONLY used for
# packages that opt in via [tool.uv.sources] below, not as a general
# fallback for everything else.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ---- Pipeline settings (read by config.py) ----
# Tool-specific config lives under [tool.*], same as [tool.uv] above.

[tool.synth-pipeline.isaac]
# Single-quoted (TOML "literal string") so backslashes are taken verbatim -
# double-quoted strings would otherwise treat "\i" etc. as escape sequences.
root = 'C:\isaac\isaac-sim-standalone-6.0.1-windows-x86_64'

[tool.synth-pipeline.rendering]
num_frames = 2000
resolution = [640, 640]
seed = 42  # same seed + same inputs -> same dataset
rt_subframes = 4  # render passes per captured frame, so swapped textures/materials fully load

# Parts and clutter are dropped onto the surface and settle under physics each
# frame, so they rest in natural poses instead of being placed at arbitrary
# (often half-buried) orientations.
# Gravity is not set here: it follows from the parts' length unit (read from
# the converted files), so mm, inch or meter CAD all fall correctly.
[tool.synth-pipeline.physics]
settle_seconds = 1.0
steps_per_second = 240

[tool.synth-pipeline.dataset]
val_split = 0.15

# Ranges are [min, max].
#
# Lengths are in multiples of R, the median bounding radius of your parts
# (printed at the start of stage 2; ~8.5 mm for the example fasteners). So
# these settings work unchanged for any part set - 3 mm electronics
# components or 500 mm brackets - in any CAD unit.
[tool.synth-pipeline.randomization]
# Scene: each class appears 0-N times per frame (several screws of one kind
# touching or overlapping, as in a real bin). Parts are dropped within
# +/- spread of the center, in units of R x sqrt(number of parts dropped) so
# crowding doesn't depend on how many classes you have. It is drawn per
# frame: small values make piles with occlusion, large ones scattered layouts.
instances_per_class = [0, 3]
part_spread = [0.4, 1.9]
empty_frame_probability = 0.03  # frames with no parts at all: teach the model to predict nothing

# Camera: it frames one randomly picked part at a random apparent size, so
# every class - including tiny ones - is seen from wide shots to close-ups.
# The distance follows from that size and the lens. Elevation is the angle
# above the ground: low angles see past the ground to the backdrop; it stays
# below 90 because looking straight down makes the camera's look-at
# orientation degenerate.
camera_target_pixels = [50, 400]  # apparent size of the framed part's bounding sphere, px
camera_focal_length = [18, 60]  # mm (35 mm-style aperture): wide angle to short telephoto
camera_elevation_deg = [20, 88]
camera_frame_offset = 0.6  # framed part sits up to this fraction of the half-frame off-center

# Unlabelled clutter (cubes, spheres, cylinders, cones) so the model learns to
# ignore things that aren't parts. No tori: a torus the size of a nut looks
# like one at a distance, and teaches the model to doubt real nuts.
distractors_per_shape = 2
distractor_size = [0.35, 2.4]  # R
distractor_spread = 7  # R
distractor_visible_probability = 0.4

ground_size = 120  # R
# Size of one texture repeat on the ground. Kept small so close-ups still
# show crisp texture detail instead of a few magnified texels.
ground_texture_tile = [2.4, 12]  # R

dome_light_intensity = [300, 2000]
point_light_position = [[-18, -18, 6], [18, 18, 35]]  # R
point_light_radius = 0.06  # R; scales with the scene, so intensity gives the same exposure at any size
point_light_intensity = [50000, 500000]
# Sun / strong overhead lamp: crisp shadows in some frames, off in others.
distant_light_probability = 0.5
distant_light_intensity = [500, 3000]
distant_light_elevation_deg = [25, 85]
