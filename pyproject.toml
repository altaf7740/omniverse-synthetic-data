[project]
name = "synthetic-data-pipeline"
version = "0.1.0"
description = "CAD (STEP) to instance-segmentation training data via Isaac Sim/Replicator, plus YOLO26-seg training."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python",
    "ultralytics",
    "torch",
    "torchvision",
]

# This repo is a set of top-level scripts + a utils/ package imported via
# cwd, not a library meant to be built/distributed - tell uv not to treat it
# as an installable package (skips needing a [build-system] / src layout).
[tool.uv]
package = false

# torch/torchvision default to CPU-only wheels on PyPI, which silently
# trains on CPU instead of the GPU. Route just those two packages to the
# CUDA build instead - `explicit = true` means this index is ONLY used for
# packages that opt in via [tool.uv.sources] below, not as a general
# fallback for everything else.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ---- Pipeline settings (read by config.py) ----
# Tool-specific config lives under [tool.*], same as [tool.uv] above.

[tool.synth-pipeline.isaac]
# Single-quoted (TOML "literal string") so backslashes are taken verbatim -
# double-quoted strings would otherwise treat "\i" etc. as escape sequences.
root = 'C:\isaac\isaac-sim-standalone-6.0.1-windows-x86_64'

[tool.synth-pipeline.rendering]
num_frames = 2000
resolution = [640, 640]
seed = 42  # same seed + same inputs -> same dataset
rt_subframes = 4  # render passes per captured frame, so swapped textures/materials fully load

# Parts and clutter are dropped onto the surface and settle under physics each
# frame, so they rest in natural poses instead of being placed at arbitrary
# (often half-buried) orientations.
[tool.synth-pipeline.physics]
gravity = 9810.0  # stage units / s^2; 9810 = 9.81 m/s^2 in mm, the example parts' CAD units
settle_seconds = 1.0
steps_per_second = 240

[tool.synth-pipeline.dataset]
val_split = 0.15

# Ranges are [min, max]. Lengths are in the parts' own CAD units (mm for the
# example fasteners).
[tool.synth-pipeline.randomization]
# Camera orbits the parts. Distance is tuned for small parts (~5-40 mm): close
# enough to show detail, far enough that parts don't fill the frame. Elevation
# is the angle above the ground: low angles see past the ground to the
# backdrop; it stays below 90 because looking straight down makes the
# camera's look-at orientation degenerate.
camera_distance = [50, 200]
camera_elevation_deg = [15, 85]
camera_look_at_jitter = 20  # off-center framing, so parts aren't always mid-frame

part_spread = 30  # parts are dropped within +/- this distance of the center (x and y)
part_visible_probability = 0.85  # each part independently; gives single- and multi-part frames

# Unlabelled clutter (cubes, spheres, cylinders, cones, tori) so the model
# learns to ignore things that aren't parts.
# Kept at or below part size and sparse - clutter should challenge the model,
# not bury the parts.
distractors_per_shape = 2
distractor_size = [3, 20]
distractor_spread = 80
distractor_visible_probability = 0.4

ground_size = 1000
# Size of one texture repeat on the ground. Kept small so close-ups still
# show crisp texture detail instead of a few magnified texels.
ground_texture_tile = [20, 100]

dome_light_intensity = [300, 2000]
point_light_position = [[-150, -150, 50], [150, 150, 300]]
point_light_intensity = [50000, 500000]
